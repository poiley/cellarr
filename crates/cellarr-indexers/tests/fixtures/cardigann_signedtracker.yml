# SYNTHETIC Cardigann definition — original example, NOT copied from Prowlarr/Indexers.
# Models a tracker that publishes NO download link in its listing rows: the magnet is
# served from a signed endpoint keyed by the row's numeric id. The definition can
# therefore express title/details/size/seeders but has no `download`, `magnet`, or
# `infohash` field — a DownloadResolver supplies the link.
# See tests/fixtures/NOTES.md and docs/agents/legal-and-licensing.md.
id: signedtracker
name: Signed Magnet Tracker
language: en-US
type: public
encoding: UTF-8
links:
  - https://signedtracker.example/

caps:
  categorymappings:
    - { id: "10", cat: "5040", desc: "TV/HD" }
  modes:
    search: [q]
    tv-search: [q, season, ep]

search:
  # Inputs declared once here apply to every path; `paths` varies only the page.
  # A path repeating a name overrides this block.
  paths:
    - path: /browse/
      method: get
    - path: /browse/
      method: get
      inputs:
        page: "2"
  inputs:
    q: "{{ .Keywords }}"
    with_adult: "1"
    # Empty when a keyword was supplied, so the widest window is only used for the
    # keyword-less listing sweep.
    age: "{{ if or .Keywords .Query.IMDBID }}{{ else }}4{{ end }}"
  rows:
    selector: "table.torrents > tbody > tr.torrent"
  fields:
    title:
      selector: "a.title"
    details:
      selector: "a.title"
      attribute: href
    size:
      selector: "td.size"
    seeders:
      selector: "td.seeders"
